<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Контакты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container-fluid">
        <div class="row">
            <!-- Меню -->
            <div class="col-md-3 bg-dark text-white min-vh-100 p-4">
                <h4 class="text-center mb-4">Меню</h4>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link text-white" href="/">Главная</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="/catalog">Каталог</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="/category/1">Категория 1</a></li>
                    <li class="nav-item"><a class="nav-link text-white active" href="/contacts">Контакты</a></li>
                </ul>
                <hr class="border-secondary">
                <div class="mt-4">
                    <p>Профиль</p>
                    <p>Выйти</p>
                    <p><small>Пользователь</small></p>
                </div>
            </div>

            <!-- Контент -->
            <div class="col-md-9 p-5">
                <h1 class="text-center mb-5">Контакты</h1>

                <div class="row">
                    <div class="col-md-5">
                        <form class="bg-white p-4 rounded shadow-sm">
                            <div class="mb-3">
                                <label class="form-label">Имя</label>
                                <input type="text" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Почта</label>
                                <input type="email" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Сообщение</label>
                                <textarea class="form-control" rows="5"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Отправить</button>
                        </form>
                    </div>
                    <div class="col-md-7">
                        <div class="bg-white p-4 rounded shadow-sm h-100">
                            <h3>Наши контакты</h3>
                            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit...</p>
                            <p>While these feedback styles cannot be styled with CSS, you can still customize the feedback text through JavaScript.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
